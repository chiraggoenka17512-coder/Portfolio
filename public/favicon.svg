<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Radial Glow Behind Monogram -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlow)"/>

  <!-- Geometric Modern Monogram C -->
  <path d="M42 22.5C39.5 20.2 35.8 19 31.5 19C23.5 19 18 24.8 18 32C18 39.2 23.5 45 31.5 45C35.8 45 39.5 43.8 42 41.5"
        stroke="url(#monogramGrad)"
        stroke-width="5.5"
        stroke-linecap="round"
        fill="none"
        filter="url(#glow)"/>

  <!-- Glowing Accent Sparkle Beacon -->
  <circle cx="43" cy="32" r="2.5" fill="#00f2fe" filter="url(#glow)"/>
</svg>
