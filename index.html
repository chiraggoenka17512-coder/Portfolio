<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Portfolio - Phase 1: Empty World</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #5c94fc;
      font-family: 'VT323', monospace, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD overlay */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }

    .crosshair::before {
      top: 7px;
      left: 0;
      width: 16px;
      height: 2px;
    }

    .crosshair::after {
      top: 0;
      left: 7px;
      width: 2px;
      height: 16px;
    }

    .hud-info {
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      padding: 8px 18px;
      border: 2px solid #373737;
      font-size: 22px;
      text-shadow: 2px 2px #000000;
      pointer-events: auto;
    }

    /* Modal Panel */
    #panel {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      max-width: 90vw;
      background-color: #c6c6c6;
      border: 4px solid #ffffff;
      border-right-color: #555555;
      border-bottom-color: #555555;
      box-shadow: 0 0 0 4px #000000, 0 12px 28px rgba(0, 0, 0, 0.6);
      padding: 16px;
      z-index: 100;
      color: #212121;
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #555555;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    #panel-title {
      font-size: 26px;
      font-weight: bold;
      color: #212121;
      text-shadow: 1px 1px #ffffff;
    }

    #panel-close {
      background: #c6c6c6;
      border: 2px solid #ffffff;
      border-right-color: #555555;
      border-bottom-color: #555555;
      color: #212121;
      font-family: 'VT323', monospace;
      font-size: 22px;
      font-weight: bold;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #panel-close:hover {
      background: #d8d8d8;
    }

    #panel-close:active {
      border: 2px solid #555555;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
    }

    .panel-body {
      font-size: 20px;
      line-height: 1.4;
      color: #212121;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-info">Portfolio World // WASD: Move &bull; E: Open Panel</div>
    <div class="crosshair"></div>
  </div>

  <div id="panel" style="display: none;">
    <div class="panel-header">
      <div id="panel-title">Project Inspector</div>
      <button id="panel-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
      <p>Phase 1: Empty World Initialized.</p>
      <p>Press Esc or click close to dismiss.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. Contract State Object
    window.__game = {
      player: {
        position: { x: 0, y: 1, z: 5 },
        yaw: 0,
        isGrounded: true
      },
      buildings: [],
      activePanel: null
    };

    // 2. DOM Elements & Panel Controls
    const panel = document.getElementById('panel');
    const panelClose = document.getElementById('panel-close');

    function openPanel(id = 'spawn') {
      panel.style.display = 'block';
      window.__game.activePanel = id;
    }

    function closePanel() {
      panel.style.display = 'none';
      window.__game.activePanel = null;
    }

    function togglePanel(id = 'spawn') {
      if (panel.style.display === 'block') {
        closePanel();
      } else {
        openPanel(id);
      }
    }

    panelClose.addEventListener('click', (e) => {
      e.preventDefault();
      closePanel();
    });

    // 3. Keyboard Event Handling
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      keys[e.code] = true;
      if (e.key) keys[e.key.toLowerCase()] = true;

      if (e.code === 'KeyE' || e.key === 'e' || e.key === 'E') {
        togglePanel('spawn');
      } else if (e.code === 'Escape' || e.key === 'Escape') {
        closePanel();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.key) keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener('blur', () => {
      for (const k in keys) {
        keys[k] = false;
      }
    });

    // 4. Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5c94fc);

    const eyeHeight = 0.4;
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(
      window.__game.player.position.x,
      window.__game.player.position.y + eyeHeight,
      window.__game.player.position.z
    );
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x5c94fc, 1);
    container.appendChild(renderer.domElement);

    // Basic Lighting (Directional + Ambient)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(-10, 20, 10);
    scene.add(dirLight);

    // Single 1x1x1 Plain Colored Cube at (0, 0.5, 0)
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 5. Game Loop & Movement
    const forwardVec = new THREE.Vector3();
    const rightVec = new THREE.Vector3();
    const moveDir = new THREE.Vector3();
    const upVec = new THREE.Vector3(0, 1, 0);
    const speed = 4.0; // units per second

    let lastTime = null;
    let renderedFirstFrame = false;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      if (lastTime === null) {
        lastTime = currentTime;
      }
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      // Calculate horizontal camera directions
      camera.getWorldDirection(forwardVec);
      forwardVec.y = 0;
      forwardVec.normalize();

      rightVec.crossVectors(forwardVec, upVec).normalize();

      let moveX = 0;
      let moveZ = 0;

      if (!window.__game.activePanel) {
        if (keys['KeyW'] || keys['w']) moveZ += 1;
        if (keys['KeyS'] || keys['s']) moveZ -= 1;
        if (keys['KeyA'] || keys['a']) moveX -= 1;
        if (keys['KeyD'] || keys['d']) moveX += 1;
      }

      if (moveX !== 0 || moveZ !== 0) {
        moveDir.set(0, 0, 0)
          .addScaledVector(forwardVec, moveZ)
          .addScaledVector(rightVec, moveX)
          .normalize();

        window.__game.player.position.x += moveDir.x * speed * dt;
        window.__game.player.position.z += moveDir.z * speed * dt;
      }

      // Sync camera to player position
      camera.position.x = window.__game.player.position.x;
      camera.position.y = window.__game.player.position.y + eyeHeight;
      camera.position.z = window.__game.player.position.z;

      renderer.render(scene, camera);

      if (!renderedFirstFrame) {
        renderedFirstFrame = true;
        console.log("READY");
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
